# SPDX-License-Identifier: GPL-3.0-or-later
# Checks, builds and publishes Layerworks to GitHub Pages (https://layerworks.tybyfy.com/) on every push to
# main, and when started by hand (Actions tab, "Publish to GitHub Pages", "Run workflow").
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

# One publish at a time. A newer push queues behind a running one rather than cancelling it, so a deployment is
# never cut off half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages reads the repository's Pages settings.
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      # In file order: the vendored keycode tests fail when shuffled (AGENTS.md).
      - run: pnpm test

      - uses: actions/configure-pages@v6

      # vite.config.ts stamps the build with GITHUB_SHA, which About links to.
      - run: pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
