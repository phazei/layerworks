<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layerworks: keyboard configurator for Vial</title>
    <meta
      name="description"
      content="Change what your keyboard's keys do, its layers, macros and lighting, in the browser. For keyboards running Vial firmware, with Keychron's extras. Free and open source."
    />
    <!-- Absolute here; the build writes it relative to the page (base './' in vite.config.ts). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* The page's colour before the stylesheet arrives, so a reload doesn't flash white: --surface in
         src/ui/tokens.css, light and dark (a test keeps them the same). */
      html {
        background: #f3f4f6;
        color-scheme: light;
      }
      html.dark {
        background: #0d0e10;
        color-scheme: dark;
      }
    </style>
    <script>
      // The theme before the app starts, so the page doesn't flash; src/ui/theme.ts keeps it up to date after.
      try {
        const forced = new URLSearchParams(location.search).get('theme')
        const choice = forced || JSON.parse(localStorage.getItem('layerworks:theme') || '"dark"')
        const dark = choice === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : choice !== 'light'
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
